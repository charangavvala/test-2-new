trigger:
  - main

pool:
  name: test-new-pool  # 👈 Self-hosted agent pool name

variables:
  node_version: '22.x'
  azureSubscription: 'ci-cd-connection'
  appName: 'ci-cd'
  packageDir: '.'

steps:
  - task: UseNode@1
    inputs:
      version: '$(node_version)'

  - script: |
      npm install
    displayName: 'Install dependencies'

  - script: |
      npm test
    displayName: 'Run tests'

  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: '$(packageDir)'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/$(appName).zip'
      replaceExistingArchive: true

  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: '$(Build.ArtifactStagingDirectory)'
      artifactName: 'drop'
      publishLocation: 'Container'

  - task: AzureWebApp@1
    inputs:
      azureSubscription: '$(azureSubscription)'
      appType: 'webAppLinux'
      appName: '$(appName)'
      package: '$(Build.ArtifactStagingDirectory)/$(appName).zip'
